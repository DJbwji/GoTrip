{% load gotrip %}<article class="tour-card"><a class="tour-image" href="{{ tour.get_absolute_url }}"><img src="{% photo tour %}" alt="{{ tour.title }}" loading="lazy"><span class="badge">{{ tour.destination }}</span><span class="card-arrow">↗</span></a><div class="tour-card-body"><div class="card-meta"><span>{{ tour.duration }} ч · {{ tour.guide.first_name }}</span><span class="rating">★ {% if tour.rating %}{{ tour.rating|floatformat:1 }}{% else %}Новинка{% endif %}</span></div><h3><a href="{{ tour.get_absolute_url }}">{{ tour.title }}</a></h3><div class="card-bottom"><span><b>{{ tour.price|floatformat:0 }} ₽</b> <small>/ человек</small></span><a href="{{ tour.get_absolute_url }}" aria-label="Подробнее об экскурсии">↗</a></div></div></article>
